<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ticket Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="ticket-card">
        <h2 class="ticket-id">Ticket ID: 409788</h2>

        <dl class="ticket-list">

            <div class="row">
                <dt class="dt">Name:</dt>
                <dd class="row-value">
                    <div class="name-row">
                        <span class="circle"></span>
                        <span class="name">Parker Seidel</span>
                    </div>
                    <span class="no-active-support">No Active Support</span>
                </dd>
            </div>

            <div class="row">
                <dt class="dt">Email:</dt>
                <dd class="row-value">
                    <a href="mailto:seidel@aptmail.com" class="email-link">seidel@aptmail.com</a>
                </dd>
            </div>

            <div class="row">
                <dt class="dt">Response Time:</dt>
                <dd class="row-value">72hours, 60hours left</dd>
            </div>

            <div class="row">
                <dt class="dt">Last Action:</dt>
                <dd class="row-value">
                    Never been locked.<br>
                    <a href="#" class="public-post-link">Link to public post</a>
                </dd>
            </div>

            <div class="row">
                <dt class="dt">Status:</dt>
                <dd class="row-value">
                    <span class="not-answered">Not answered</span>
                </dd>
            </div>

        </dl>
    </div>

</body>

</html>
