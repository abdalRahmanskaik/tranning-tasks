<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Custom Data Table</title>
</head>

<body>

  <table class="table">
    <thead>
      <tr>
        <th>Contact name</th>
        <th>City</th>
        <th>Country</th>
        <th>Is Promoted</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Maria Anders</td>
        <td>Berlin</td>
        <td>
          <div class="country-cell">
            <img src="https://flagcdn.com/w20/de.png" class="flag-icon" alt="Germany Flag">
            Germany
          </div>
        </td>
        <td><input type="checkbox"></td>
      </tr>
      <tr>
        <td>Ana Trujillo</td>
        <td>México D.F.</td>
        <td>
          <div class="country-cell">
            <img src="https://flagcdn.com/w20/mx.png" class="flag-icon" alt="Mexico Flag">
            Mexico
          </div>
        </td>
        <td><input type="checkbox"></td>
      </tr>
      <tr>
        <td>Antonio Moreno</td>
        <td>México D.F.</td>
        <td>
          <div class="country-cell">
            <img src="https://flagcdn.com/w20/mx.png" class="flag-icon" alt="Mexico Flag">
            Mexico
          </div>
        </td>
        <td><input type="checkbox" checked></td>
      </tr>
      <tr>
        <td>Thomas Hardy</td>
        <td>London</td>
        <td>
          <div class="country-cell">
            <img src="https://flagcdn.com/w20/gb.png" class="flag-icon" alt="UK Flag">
            UK
          </div>
        </td>
        <td><input type="checkbox"></td>
      </tr>
    </tbody>
  </table>

</body>

</html>
