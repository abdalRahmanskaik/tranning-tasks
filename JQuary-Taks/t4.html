<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }

    .accordion { border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }

    .accordion-item { border-bottom: 1px solid #ddd; }
    .accordion-item:last-child { border-bottom: none; }

    .accordion-header {
      padding: 14px 18px;
      background: #f7f7f7;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .accordion-header:hover { background: #eee; }

    .accordion-header .icon {
      transition: transform 0.3s ease;
    }
    .accordion-header.active .icon {
      transform: rotate(180deg);
    }

    .accordion-content {
      padding: 0 18px;
      max-height: 0;
      overflow: hidden;
      background: #fff;
      transition: max-height 0.3s ease, padding 0.3s ease;
    }
    .accordion-content.open {
      padding: 14px 18px;
    }
  </style>
</head>
<body>

  <div class="accordion">
    <div class="accordion-item">
      <div class="accordion-header">Section 1 <span class="icon">▾</span></div>
      <div class="accordion-content">
        <p>This is the content for section 1</p>
      </div>
    </div>

    <div class="accordion-item">
      <div class="accordion-header">Section 2 <span class="icon">▾</span></div>
      <div class="accordion-content">
        <p>This is the content for section 2</p>
      </div>
    </div>

    <div class="accordion-item">
      <div class="accordion-header">Section 3 <span class="icon">▾</span></div>
      <div class="accordion-content">
        <p>This is the content for section 3</p>
      </div>
    </div>
  </div>

  <script>
    $(document).ready(function () {
      $(".accordion-header").on("click", function () {
        const $content = $(this).next(".accordion-content");
        const isOpen = $(this).hasClass("active");

        $(".accordion-header").removeClass("active");
        $(".accordion-content").removeClass("open").css("max-height", 0);

        if (!isOpen) {
          $(this).addClass("active");
          $content.addClass("open");
          $content.css("max-height", $content.prop("scrollHeight") + "px");
        }
      });
    });
  </script>

</body>
</html>
