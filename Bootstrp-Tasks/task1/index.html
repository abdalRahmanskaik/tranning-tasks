<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">

        
    
</head>

<body>

    <section class="hero position-relative">
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Landing</a>
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Reviews</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">FAQ</a></li>
                        <li class="nav-item ms-3">
                            <a class="btn btn-get-started" href="#">Get Started</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container py-5">
            <div class="row align-items-center min-vh-75 py-5">
                <div class="col-lg-6">
                    <h1 class="mb-3">Fly makes you<br>faster</h1>
                    <p class="mb-4" style="max-width: 400px;">
                        New free template by uicookies.com. For more templates visit the site.
                        Lorem ipsum dolor sit amet, consectetur adipisicing elit.
                    </p>
                    <button class="btn btn-see-pricing text-white">SEE PRICING</button>
                </div>

                <div class="col-lg-6 d-flex justify-content-center justify-content-lg-end mt-5 mt-lg-0">
                    <div class="signup-card p-4 w-100">
                        <h5 class="text-center mb-4">Sign Up for Free</h5>
                        <form>
                            <div class="mb-3">
                                <input type="text" class="form-control" placeholder="Full name">
                            </div>
                            <div class="mb-3">
                                <input type="email" class="form-control" placeholder="Email">
                            </div>
                            <div class="mb-3">
                                <input type="email" class="form-control" placeholder="Email">
                            </div>
                            <div class="mb-4">
                                <select class="form-select">
                                    <option selected>Type</option>
                                    <option value="1">Basic</option>
                                    <option value="2">Pro</option>
                                    <option value="3">Enterprise</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-register text-white w-100">Register</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-curve"></div>
    </section>

<script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
